name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore AudioPlaybackConnector.sln

      # translate/generated is git-ignored upstream, so regenerate the .ymo
      # resources and the .rc that the project compiles. po2ymo.py now uses only
      # the Python standard library, so no pip install is needed.
      - name: Generate translation resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force translate/generated | Out-Null
          python translate/po2ymo.py translate/source/zh_CN.po translate/generated/zh_CN.ymo
          python translate/po2ymo.py translate/source/zh_TW.po translate/generated/zh_TW.ymo
          @(
            '#include "../../targetver.h"',
            '#include "windows.h"',
            'LANGUAGE LANG_CHINESE, SUBLANG_CHINESE_SIMPLIFIED',
            '1 YMO "zh_CN.ymo"',
            'LANGUAGE LANG_CHINESE, SUBLANG_CHINESE_TRADITIONAL',
            '1 YMO "zh_TW.ymo"'
          ) | Set-Content -Path translate/generated/translate.rc -Encoding ascii

      # The .ico is a binary asset; fetch it from upstream when the checkout was
      # created from text-only files (e.g. pushed through the API).
      - name: Ensure binary assets
        shell: pwsh
        run: |
          if (-not (Test-Path AudioPlaybackConnector.ico)) {
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/ysc3839/AudioPlaybackConnector/master/AudioPlaybackConnector.ico -OutFile AudioPlaybackConnector.ico
          }

      - name: Build Release x64
        run: msbuild AudioPlaybackConnector.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path x64/Release/AudioPlaybackConnector64.exe)) { throw "Build output missing" }
          Get-Item x64/Release/AudioPlaybackConnector64.exe | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlaybackConnector64
          path: x64/Release/AudioPlaybackConnector64.exe

      - name: Publish executable to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag x64/Release/AudioPlaybackConnector64.exe --title "Build $env:GITHUB_RUN_NUMBER" --notes "Automated Windows x64 build" --target $env:GITHUB_SHA
